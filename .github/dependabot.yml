version: 2
updates:
  # Includes SDK dependencies and the VitePress documentation tooling.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Routine version updates wait eight days; security updates are exempt.
    cooldown:
      default-days: 8
    groups:
      # Vitest and its plugins require matching versions, including major updates.
      vitest:
        patterns:
          - vitest
          - '@vitest/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 8
